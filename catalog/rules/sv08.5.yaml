# Prismatic Evolutions (English), TCGdex id sv08.5.
# 180 numbered cards: 131 in the main numbering plus 49 secret rares (132-180).
#
# Versions (researched 2026-11-14):
#   - Common / Uncommon Pokémon: Normal, Reverse Holo, Poké Ball, Master Ball.
#   - Rare Pokémon: Holo, Reverse Holo, Poké Ball, Master Ball.
#   - Common / Uncommon Trainers (093-131 except the ACE SPECs): Normal,
#     Reverse Holo, Poké Ball. Trainers have NO Master Ball version.
#   - Everything else (Double rare ex, ACE SPEC Rare, Ultra Rare,
#     Special illustration rare, Hyper rare): one version only (single).
#   Master set = 180 cards + 100 reverse + 100 Poké Ball + 67 Master Ball = 447.
#   (67 = 33 common + 13 uncommon + 21 rare Pokémon; the 33 C/U Trainers make
#   up the difference between 100 Poké Ball and 67 Master Ball.)
#
# Sources:
#   - TCGdex API, https://api.tcgdex.net/v2/en/sets/sv08.5 and each card's
#     `variants_detailed` (foil "pokeball" / "masterball"): exactly the pattern
#     above, card by card.
#   - TCGWatchtower master set page,
#     https://tcgwatchtower.com/pokemon/sets/scarlet-violet/prismatic-evolutions/master-set:
#     same per-type table, "Common, uncommon, and rare Trainers: Regular, Reverse
#     Holo, Poké Ball Pattern" with no Master Ball; ACE SPEC / ex / secret rares
#     one version; 447 total.
#   - Pokecottage master set guide,
#     https://pokecottage.com/prismatic-evolutions-master-set-guide:
#     "131 standard set cards, 100 reverse holos, 100 Poké Ball pattern, 67 Master
#     Ball pattern and 49 Secret Rares" (447).
#   - PriceCharting product search (marketplace price guide): Exeggcute #1 and
#     Exeggutor #2 have Reverse / Poke Ball / Master Ball; Amarys #93 has Reverse
#     and Poke Ball but no Master Ball; Max Rod #116 and the ex cards have no
#     ball or reverse versions.
#
# Extra cards (category "promos"): ex cards reprinted with a "Prismatic
# Evolutions" set-logo stamp in this set's own collection boxes. Confirmed by
# TCGdex (variants_detailed stamp "set-logo") plus a second source each:
# PriceCharting "[Stamped]" products for 006, 014, 023, 026, 030, 034, 041, 060,
# 075, 076, 082; for Lucario ex 051 and Tyranitar ex 064, the Lucario ex &
# Tyranitar ex Premium Collection listing ("specially stamped foil promo cards")
# on cardcodex.com and retailer listings titled "(Prismatic Evolutions Stamp)".
# Products: the nine Eevee / Eeveelution stamped ex came one per Prismatic
# Evolutions Surprise Box (PokeBeach product announcement, retailer listings).
# Lugia ex 082: Bulbapedia (via search snippets) reports two stamped printings
# (stamp on the left, Lugia ex Special Collection, Europe; stamp on the right,
# Lugia ex & Latias ex Premium Collection, Target US). PriceCharting lists only
# one. Only the US stamp-on-right printing is tracked here; see catalog/README.md
# "Open questions".
# Other stamps (Holiday Calendar snowflake, Pokémon Day, Prize Pack, league),
# cosmos holos and jumbo cards are NOT included; see the README.
id: sv08.5
source:
  tcgdex: sv08.5
name: Prismatic Evolutions
series: Scarlet & Violet
releaseDate: "2025-01-17"
categories:
  - id: main
    kind: main
    label: Main set
  - id: promos
    kind: promo_stamped
    label: Promos & stamped
categoryRules: []
versionRules:
  # Common and Uncommon Trainers: no Master Ball version. Must come before the
  # Common/Uncommon rule below (first match wins).
  - match:
      ids: [
        sv08.5-093, sv08.5-094, sv08.5-095, sv08.5-096, sv08.5-097, sv08.5-098,
        sv08.5-099, sv08.5-100, sv08.5-101, sv08.5-102, sv08.5-103, sv08.5-104,
        sv08.5-105, sv08.5-106, sv08.5-107, sv08.5-108, sv08.5-109, sv08.5-110,
        sv08.5-111, sv08.5-112, sv08.5-113, sv08.5-114, sv08.5-115, sv08.5-118,
        sv08.5-120, sv08.5-121, sv08.5-122, sv08.5-123, sv08.5-124, sv08.5-125,
        sv08.5-126, sv08.5-127, sv08.5-130,
      ]
    versions: [normal, reverse, pokeball]
  - match:
      rarity: [Common, Uncommon]
    versions: [normal, reverse, pokeball, masterball]
  - match:
      rarity: [Rare]
    versions: [holo, reverse, pokeball, masterball]
  # Double rare, ACE SPEC Rare, Ultra Rare, Special illustration rare, Hyper rare.
  - match: {}
    versions: [single]
overrides: {}
# Extra card ids follow <set id>-<number>-stamp-<stamp>[-<printing>] (see catalog/README.md)
# and are permanent once the set is published.
